name: build-verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-verify:
    name: Build + accessibility audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        # No package-lock.json is committed, so use `npm install` rather
        # than `npm ci` (and npm dependency caching is skipped). Committing
        # a lockfile would make CI fully deterministic.
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Playwright (Python) + Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      # The a11y audit above runs under the Python Playwright install, but
      # the e2e specs run under @playwright/test and need the Node-side
      # Chromium. Browsers share the same cache on Linux, but revisions
      # differ per Playwright version — install the Node one explicitly.
      - name: Install Playwright (Node) + Chromium for e2e
        run: npx playwright install --with-deps chromium

      # .env is gitignored, so CI builds its own. NEXTAUTH_SECRET is
      # required: the runtime a11y audit signs in a throwaway account and
      # NextAuth refuses to sign JWTs without it. The audit's dev server
      # binds to port 3000, matching NEXTAUTH_URL. DATABASE_URL is inert
      # for Prisma today (the schema hardcodes file:./dev.db) but is kept
      # for future env-based configuration.
      - name: Create .env for CI
        run: |
          echo 'DATABASE_URL="file:./dev.db"' > .env
          echo "NEXTAUTH_SECRET=$(openssl rand -base64 32)" >> .env
          echo 'NEXTAUTH_URL=http://localhost:3000' >> .env

      - name: Create SQLite database from migrations
        # The single committed migration is self-contained (all tables), so
        # a fresh prisma/dev.db is fully built by `migrate deploy`.
        run: npx prisma migrate deploy

      - name: Unit tests + AI mock coverage gate
        # Vitest runs the unit suite; the coverage config enforces 100%
        # coverage of the mock AI response logic (src/lib/ai/mock.ts) and
        # fails the build if any branch regresses.
        run: npm run test -- --coverage

      # build:verify = `next build` (with the prebuild a11y CSS guard) +
      # the Playwright runtime audit of the public pages in all 4 modes.
      # The audit starts its own dev server and shuts it down afterwards.
      - name: Build + accessibility audit
        run: npm run build:verify

      # Arabic i18n & RTL e2e: flips the app into Arabic via the header
      # toggle and asserts RTL rendering + mirrored layout on all six
      # authenticated surfaces (dashboard, health-logs, resources, profile,
      # reports, zen). The auth-setup project (a dependency of the
      # chromium project) signs in the throwaway account first, and
      # Playwright's webServer boots its own dev server on :3000 (the a11y
      # audit above already shut its own down).
      - name: Arabic i18n & RTL e2e
        run: npm run test:e2e e2e/arabic-rtl.spec.ts

      # PWA & offline e2e: builds the production bundle once into .next-pwa
      # (scripts/run-pwa-e2e.mjs) and serves it with `next start` on :3102
      # with the service worker enabled. Verifies SW registration, the shell
      # precache, manifest installability, and offline navigation fallbacks
      # (precached page + uncached route → /offline). Uses its own distDir
      # so it never collides with the dev-server builds.
      - name: PWA & offline e2e
        run: npm run test:e2e:pwa

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
