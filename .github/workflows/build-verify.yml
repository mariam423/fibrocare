name: build-verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-verify:
    name: Build + accessibility audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The Prisma schema and migration lock are PostgreSQL-only (Neon in
    # production), so the build needs a real Postgres: `npm run build`
    # runs scripts/db-migrate-pg.mjs, which applies prisma-pg/migrations
    # before compiling. Provisioning a throwaway service container keeps
    # the job hermetic (no external database is ever touched).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fibrocare
          POSTGRES_PASSWORD: fibrocare
          POSTGRES_DB: fibrocare_build
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fibrocare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # db-migrate-pg.mjs (run inside `npm run build`) reads the
      # connection string from process env — it does not load .env —
      # so the job exports it directly. The same values are written
      # into .env by scripts/run-e2e-env.mjs for the Next runtime.
      # Throwaway service-container credentials — not real secrets.
      DATABASE_URL: postgresql://fibrocare:fibrocare@localhost:5432/fibrocare_build # security: ok throwaway CI container
      DIRECT_URL: postgresql://fibrocare:fibrocare@localhost:5432/fibrocare_build # security: ok throwaway CI container
      CI_DATABASE_URL: postgresql://fibrocare:fibrocare@localhost:5432/fibrocare_build # security: ok throwaway CI container
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        # No package-lock.json is committed, so use `npm install` rather
        # than `npm ci` (and npm dependency caching is skipped). Committing
        # a lockfile would make CI fully deterministic.
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Playwright (Python) + Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      # The a11y audit above runs under the Python Playwright install, but
      # the e2e specs run under @playwright/test and need the Node-side
      # Chromium. Browsers share the same cache on Linux, but revisions
      # differ per Playwright version — install the Node one explicitly.
      - name: Install Playwright (Node) + Chromium for e2e
        run: npx playwright install --with-deps chromium

      # .env is gitignored, so CI builds its own via the shared script
      # (same file e2e.yml uses, so the two workflows cannot drift).
      # NEXTAUTH_SECRET is required: the runtime a11y audit signs in a
      # throwaway account and NextAuth refuses to sign JWTs without it.
      # The audit's dev server binds to port 3000, matching NEXTAUTH_URL.
      - name: Create .env for CI
        run: node scripts/run-e2e-env.mjs

      - name: Apply Postgres migrations
        # Explicit schema path: prisma-pg/migrations is the canonical
        # Postgres chain (the one production applies via db-migrate-pg.mjs).
        # This is a pre-flight of the same migrate deploy that `npm run
        # build` runs, so failures surface with a clear step name.
        run: npx prisma migrate deploy --schema prisma-pg/schema.prisma

      - name: Unit tests + AI mock coverage gate
        # Vitest runs the unit suite; the coverage config enforces 100%
        # coverage of the mock AI response logic (src/lib/ai/mock.ts) and
        # fails the build if any branch regresses.
        run: npm run test -- --coverage

      # build:verify = `next build` (with the prebuild a11y CSS guard) +
      # the Playwright runtime audit of the public pages in all 4 modes.
      # The audit starts its own dev server and shuts it down afterwards.
      - name: Build + accessibility audit
        run: npm run build:verify

      # Arabic i18n & RTL e2e: flips the app into Arabic via the header
      # toggle and asserts RTL rendering + mirrored layout on all six
      # authenticated surfaces (dashboard, health-logs, resources, profile,
      # reports, zen). The auth-setup project (a dependency of the
      # chromium project) signs in the throwaway account first, and
      # Playwright's webServer boots its own dev server on :3000 (the a11y
      # audit above already shut its own down).
      - name: Arabic i18n & RTL e2e
        run: npm run test:e2e e2e/arabic-rtl.spec.ts

      # PWA & offline e2e: builds the production bundle once into .next-pwa
      # (scripts/run-pwa-e2e.mjs) and serves it with `next start` on :3102
      # with the service worker enabled. Verifies SW registration, the shell
      # precache, manifest installability, and offline navigation fallbacks
      # (precached page + uncached route → /offline). Uses its own distDir
      # so it never collides with the dev-server builds.
      - name: PWA & offline e2e
        run: npm run test:e2e:pwa

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
