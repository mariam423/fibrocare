<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">Body pain and brain processing</title>
  <desc id="desc">Side profile of the human body showing how peripheral tissue signals travel up the spinal cord to the brain, where amplification leads to widespread pain and cognitive symptoms.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1312"/>
      <stop offset="100%" stop-color="#0E1817"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0%" stop-color="#8FBF9B" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#8FBF9B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nerve" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9CC6A4"/>
      <stop offset="60%" stop-color="#7FB5A5"/>
      <stop offset="100%" stop-color="#5E9C84"/>
    </linearGradient>
    <radialGradient id="bpoint" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F1A94E"/>
      <stop offset="100%" stop-color="#D97E32"/>
    </radialGradient>
  </defs>

  <rect width="720" height="480" fill="url(#bg)"/>
  <rect width="720" height="480" fill="url(#glow)"/>

  <!-- Brain -->
  <g>
    <ellipse cx="250" cy="118" rx="58" ry="66" fill="#1E332F" stroke="#8FBF9B" stroke-opacity="0.55" stroke-width="1.6"/>
    <path d="M250 60 c-24 6 -34 30 -26 48 c5 30 18 40 26 36 c8 4 21 -6 26 -36 c8 -18 -2 -42 -26 -48z" fill="#2A463F"/>
    <!-- cortex folds -->
    <path d="M222 96 c8 6 16 2 22 8" stroke="#5E9C84" stroke-opacity="0.5" stroke-width="1.4" fill="none"/>
    <path d="M246 106 c-6 8 -2 16 8 16" stroke="#5E9C84" stroke-opacity="0.5" stroke-width="1.4" fill="none"/>
    <path d="M272 92 c-4 10 -2 18 6 22" stroke="#5E9C84" stroke-opacity="0.5" stroke-width="1.4" fill="none"/>
    <path d="M232 128 c8 4 14 10 12 18" stroke="#5E9C84" stroke-opacity="0.5" stroke-width="1.4" fill="none"/>
    <!-- labels -->
    <text x="250" y="206" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#CBE3CF">Central amplification</text>
    <text x="250" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#A5B8AC">Brain &#8226; CNS sensitization</text>
  </g>

  <!-- Face / profile -->
  <path d="M310 88
    c4 -14 18 -22 34 -20
    c20 2 32 14 34 30
    c2 12 -2 20 -8 22
    c6 6 10 16 10 28
    c0 20 -12 28 -20 30
    c0 8 -2 12 -1 16
    l-2 10
    c-2 8 -10 12 -16 8
    c-6 -3 -8 -9 -5 -15
    l4 -16
    c-2 -6 -6 -8 -10 -6
    l0 -10
    c-10 -4 -16 -14 -18 -26
    c-2 -12 1 -24 8 -34
    z" fill="#19302B" stroke="#2C4A44" stroke-width="1.5"/>

  <!-- Spinal cord -->
  <g stroke="url(#nerve)" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M292 176 c-4 40 -8 90 -10 150 c-2 56 0 96 0 96"/>
  </g>
  <!-- nerve dashes indicating ascending signal -->
  <g stroke="#0A1312" stroke-width="3" stroke-linecap="round">
    <path d="M288 200 l-2 10"/>
    <path d="M288 248 l-2 10"/>
    <path d="M286 300 l-2 10"/>
    <path d="M285 360 l-2 10"/>
  </g>
  <text x="302" y="300" transform="rotate(-84 302 300)" font-family="Arial, sans-serif" font-size="11" fill="#A5B8AC">Spinal cord</text>

  <!-- Peripheral body -->
  <g stroke="#8FBF9B" stroke-opacity="0.4" stroke-width="1.4" fill="none">
    <path d="M282 240 c26 30 30 70 20 110 c-8 32 -4 60 10 84"/>
    <path d="M282 240 c-30 22 -44 56 -40 96 c4 36 14 62 30 88"/>
    <ellipse cx="278" cy="430" rx="34" ry="20" stroke-opacity="0.3"/>
  </g>

  <!-- Pain points in the body -->
  <g>
    <circle cx="252" cy="248" r="7" fill="url(#bpoint)"/>
    <circle cx="308" cy="258" r="7" fill="url(#bpoint)"/>
    <circle cx="268" cy="330" r="7" fill="url(#bpoint)"/>
    <circle cx="300" cy="356" r="7" fill="url(#bpoint)"/>
    <circle cx="282" cy="414" r="7" fill="url(#bpoint)"/>
    <circle cx="262" cy="420" r="7" fill="url(#bpoint)"/>
  </g>

  <!-- Amplification marker near spinal cord -->
  <path d="M300 150 l10 -12 M310 150 l-10 -12 M294 162 l10 -8 M314 158 l-8 -10" stroke="#F1A94E" stroke-opacity="0.8" stroke-width="2" stroke-linecap="round"/>

  <!-- Right panel: symptom callouts -->
  <g>
    <rect x="400" y="120" width="280" height="74" rx="14" fill="#12231F" stroke="#2C4A44" stroke-width="1"/>
    <circle cx="424" cy="157" r="8" fill="url(#bpoint)"/>
    <text x="446" y="152" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#E8F0EB">Widespread body pain</text>
    <text x="424" y="176" font-family="Arial, sans-serif" font-size="11" fill="#A5B8AC">Muscles, joints and soft tissue</text>

    <rect x="400" y="214" width="280" height="74" rx="14" fill="#12231F" stroke="#2C4A44" stroke-width="1"/>
    <path d="M416 240 c4 -8 8 -6 12 0 c3 -10 8 -10 12 0 c3 -8 7 -6 11 0" stroke="#CBE3CF" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="446" y="251" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#E8F0EB">Fatigue &amp; brain fog</text>
    <text x="424" y="274" font-family="Arial, sans-serif" font-size="11" fill="#A5B8AC">Cognitive difficulties</text>

    <rect x="400" y="308" width="280" height="74" rx="14" fill="#12231F" stroke="#2C4A44" stroke-width="1"/>
    <path d="M416 326 l14 0 M423 333 l-7 -8 M423 333 l7 -8" stroke="#CBE3CF" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="446" y="345" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#E8F0EB">Non-restorative sleep</text>
    <text x="424" y="368" font-family="Arial, sans-serif" font-size="11" fill="#A5B8AC">Waking unrefreshed</text>
  </g>

  <!-- Connecting line panel->body -->
  <path d="M400 157 c-30 0 -48 -4 -54 -10" stroke="#8FBF9B" stroke-opacity="0.4" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/>

  <!-- Footer note -->
  <text x="360" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6E8A7C">Fibromyalgia amplifies normal signals &#8212; the brain turns up the volume on pain</text>
</svg>
