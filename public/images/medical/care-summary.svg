<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">Doctor-ready care summary report</title>
  <desc id="desc">Overview of a patient care summary report with symptom trends, insights and notes that the patient can share with their doctor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1312"/>
      <stop offset="100%" stop-color="#0E1817"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0%" stop-color="#8FBF9B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8FBF9B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="720" height="480" fill="url(#bg)"/>
  <rect width="720" height="480" fill="url(#glow)"/>

  <!-- Document card -->
  <rect x="56" y="70" width="608" height="360" rx="20" fill="#101B19" stroke="#2C4A44" stroke-width="1.6"/>

  <!-- Header bar -->
  <rect x="56" y="70" width="608" height="56" rx="20" fill="#12231F" stroke="#2C4A44" stroke-width="1"/>
  <circle cx="96" cy="98" r="16" fill="#2A463F"/>
  <text x="96" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#9CC6A4">FC</text>
  <text x="122" y="94" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#E8F0EB">FibroCare Care Summary</text>
  <text x="122" y="110" font-family="Arial, sans-serif" font-size="9" fill="#A5B8AC">Prepared for your appointment</text>
  <rect x="520" y="88" width="120" height="24" rx="12" fill="#1A3A2C" stroke="#2CAA6A" stroke-width="1"/>
  <text x="580" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#8FD0AC">SHARE WITH DOCTOR</text>

  <!-- Row of stat blocks -->
  <g>
    <rect x="86" y="150" width="170" height="72" rx="12" fill="#12231F" stroke="#2C4A44" stroke-width="1"/>
    <text x="104" y="176" font-family="Arial, sans-serif" font-size="9" fill="#A5B8AC">PAIN AVERAGE (30d)</text>
    <text x="104" y="200" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#CBE3CF">5.2<span font-size="11" fill="#6E8A7C">/10</span></text>

    <rect x="275" y="150" width="170" height="72" rx="12" fill="#12231F" stroke="#2C4A44" stroke-width="1"/>
    <text x="293" y="176" font-family="Arial, sans-serif" font-size="9" fill="#A5B8AC">ENERGY AVERAGE</text>
    <text x="293" y="200" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#CBE3CF">4.8<span font-size="11" fill="#6E8A7C">/10</span></text>

    <rect x="464" y="150" width="170" height="72" rx="12" fill="#12231F" stroke="#2C4A44" stroke-width="1"/>
    <text x="482" y="176" font-family="Arial, sans-serif" font-size="9" fill="#A5B8AC">GOOD SLEEP NIGHTS</text>
    <text x="482" y="200" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#CBE3CF">12<span font-size="11" fill="#6E8A7C">/30</span></text>
  </g>

  <!-- Trend section -->
  <g>
    <text x="86" y="256" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#E8F0EB">Symptom trend</text>
    <!-- mini line chart -->
    <polyline points="86,300 140,288 194,296 248,280 302,286 356,270 410,278 464,262 518,270 572,258"
      fill="none" stroke="#7FB5A5" stroke-width="2"/>
    <circle cx="86" cy="300" r="3" fill="#7FB5A5"/>
    <circle cx="572" cy="258" r="3" fill="#7FB5A5"/>
    <text x="86" y="320" font-family="Arial, sans-serif" font-size="9" fill="#6E8A7C">4 weeks ago</text>
    <text x="556" y="320" font-family="Arial, sans-serif" font-size="9" fill="#6E8A7C">today</text>
    <text x="620" y="300" text-anchor="end" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#8FD0AC">&#8595; improving</text>
  </g>

  <!-- Insight box -->
  <rect x="86" y="344" width="548" height="60" rx="12" fill="#2C2A20" stroke="#6A5A3A" stroke-width="1"/>
  <text x="106" y="368" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#F1E0A8">&#9654; Notable insight for your doctor</text>
  <text x="106" y="388" font-family="Arial, sans-serif" font-size="10" fill="#C9A54E">Symptoms improve with earlier bedtime; flares follow high-stress days.</text>

  <!-- page footer -->
  <text x="360" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6E8A7C">SVG text placeholder — see rendered document for the full layout</text>
</svg>
