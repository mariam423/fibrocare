<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">How fibromyalgia is diagnosed</title>
  <desc id="desc">Clinical diagram showing how fibromyalgia is diagnosed: a doctor rules out other conditions, then applies the widespread pain index and symptom severity criteria to reach a diagnosis.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1312"/>
      <stop offset="100%" stop-color="#0E1817"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0%" stop-color="#8FBF9B" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#8FBF9B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="720" height="480" fill="url(#bg)"/>
  <rect width="720" height="480" fill="url(#glow)"/>

  <text x="360" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#E8F0EB" letter-spacing="1">HOW FIBROMYALGIA IS DIAGNOSED</text>
  <text x="360" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#A5B8AC">A clinical diagnosis based on signs, symptoms and exclusion</text>

  <!-- Step flow: three stages -->
  <!-- Stage 1: Doctor & physical exam -->
  <g>
    <rect x="46" y="120" width="196" height="170" rx="16" fill="#12231F" stroke="#2C4A44" stroke-width="1.4"/>
    <circle cx="144" cy="170" r="28" fill="#2A463F" stroke="#8FBF9B" stroke-opacity="0.5" stroke-width="1.4"/>
    <circle cx="144" cy="162" r="11" fill="#7FB5A5"/>
    <path d="M120 188 a24 24 0 0 1 48 0 l0 4 a18 18 0 0 1 -48 0 z" fill="#7FB5A5" opacity="0.85"/>
    <path d="M120 196 l-16 26 M168 196 l16 26" stroke="#7FB5A5" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <text x="144" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#E8F0EB">1 &#183; Clinical exam</text>
    <text x="144" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#A5B8AC">Tender points &amp; history</text>
  </g>

  <!-- Stage 2: Rule out -->
  <g>
    <rect x="272" y="120" width="176" height="170" rx="16" fill="#12231F" stroke="#2C4A44" stroke-width="1.4"/>
    <circle cx="360" cy="172" r="26" fill="#2A463F" stroke="#8FBF9B" stroke-opacity="0.45" stroke-width="1.4"/>
    <line x1="344" y1="172" x2="376" y2="172" stroke="#C77A6A" stroke-width="3" stroke-linecap="round"/>
    <path d="M346 182 l28 -20 M374 182 l-28 -20" stroke="#C77A6A" stroke-width="3" stroke-linecap="round"/>
    <text x="360" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#E8F0EB">2 &#183; Rule out</text>
    <text x="360" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#A5B8AC">Blood tests, imaging</text>
  </g>

  <!-- Stage 3: Criteria -->
  <g>
    <rect x="478" y="120" width="196" height="170" rx="16" fill="#12231F" stroke="#2C4A44" stroke-width="1.4"/>
    <rect x="520" y="146" width="30" height="34" rx="5" fill="#2A463F" stroke="#7FB5A5" stroke-opacity="0.6" stroke-width="1"/>
    <rect x="562" y="146" width="30" height="34" rx="5" fill="#2A463F" stroke="#7FB5A5" stroke-opacity="0.6" stroke-width="1"/>
    <rect x="604" y="146" width="30" height="34" rx="5" fill="#2A463F" stroke="#7FB5A5" stroke-opacity="0.6" stroke-width="1"/>
    <line x1="532" y1="146" x2="532" y2="180" stroke="#7FB5A5" stroke-width="2"/>
    <line x1="574" y1="146" x2="574" y2="180" stroke="#7FB5A5" stroke-width="2"/>
    <line x1="616" y1="146" x2="616" y2="180" stroke="#7FB5A5" stroke-width="2"/>
    <text x="576" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#E8F0EB">3 &#183; Criteria</text>
    <text x="576" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#A5B8AC">WPI + symptom severity</text>
  </g>

  <!-- Arrows between -->
  <g stroke="#8FBF9B" stroke-opacity="0.7" stroke-width="2.4" fill="none">
    <path d="M242 205 l14 0 M262 205 l11 9 M262 205 l11 -9"/>
    <path d="M448 205 l14 0 M468 205 l11 9 M468 205 l11 -9"/>
  </g>

  <!-- Criteria detail panel -->
  <rect x="46" y="316" width="628" height="86" rx="14" fill="#12231F" stroke="#2C4A44" stroke-width="1"/>
  <rect x="66" y="332" width="150" height="54" rx="10" fill="#1A2F29" stroke="#2C4A44" stroke-width="1"/>
  <text x="141" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#CBE3CF">Widespread Pain Index</text>
  <text x="141" y="376" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#A5B8AC">19 body areas, &#8805;7</text>
  <rect x="236" y="332" width="150" height="54" rx="10" fill="#1A2F29" stroke="#2C4A44" stroke-width="1"/>
  <text x="311" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#CBE3CF">Symptom Severity</text>
  <text x="311" y="376" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#A5B8AC">Fatigue, sleep, cognition</text>
  <rect x="406" y="332" width="150" height="54" rx="10" fill="#1A2F29" stroke="#2C4A44" stroke-width="1"/>
  <text x="481" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#CBE3CF">&gt;3 months</text>
  <text x="481" y="376" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#A5B8AC">Symptom duration</text>

  <text x="360" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6E8A7C">There is no single lab test &#8212; diagnosis rests on the pattern of symptoms</text>
</svg>
