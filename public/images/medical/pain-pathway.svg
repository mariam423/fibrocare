<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">Chronic pain pathway</title>
  <desc id="desc">Diagram of the pain pathway: pain signals travel from the body through the spinal cord to the brain, where central sensitization amplifies the signal causing chronic widespread pain in fibromyalgia.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1312"/>
      <stop offset="100%" stop-color="#0E1817"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0%" stop-color="#8FBF9B" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#8FBF9B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9CC6A4"/>
      <stop offset="100%" stop-color="#5E9C84"/>
    </linearGradient>
  </defs>

  <rect width="720" height="480" fill="url(#bg)"/>
  <rect width="720" height="480" fill="url(#glow)"/>

  <text x="360" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#E8F0EB" letter-spacing="1">HOW CHRONIC PAIN HAPPENS</text>
  <text x="360" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#A5B8AC">Central sensitization in fibromyalgia</text>

  <!-- Three stage boxes -->
  <!-- Stage 1: Body -->
  <g>
    <rect x="46" y="120" width="176" height="180" rx="16" fill="#12231F" stroke="#2C4A44" stroke-width="1.4"/>
    <ellipse cx="134" cy="170" rx="20" ry="12" fill="#2A463F" stroke="#8FBF9B" stroke-opacity="0.5" stroke-width="1"/>
    <path d="M134 182 l0 60 q0 18 8 26" stroke="#8FBF9B" stroke-opacity="0.6" stroke-width="1.6" fill="none"/>
    <circle cx="146" cy="200" r="5" fill="#C77A6A"/>
    <circle cx="122" cy="216" r="5" fill="#C77A6A"/>
    <circle cx="140" cy="234" r="5" fill="#C77A6A"/>
    <text x="134" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#E8F0EB">1 &#183; Body</text>
    <text x="134" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#A5B8AC">Signal from tissues</text>
  </g>

  <!-- Stage 2: Spinal cord -->
  <g>
    <rect x="272" y="120" width="176" height="180" rx="16" fill="#12231F" stroke="#2C4A44" stroke-width="1.4"/>
    <path d="M360 140 l0 140" stroke="url(#nav)" stroke-width="10" opacity="0.9" stroke-linecap="round"/>
    <!-- amplification arrows -->
    <path d="M366 158 l8 -10 M378 158 l-8 -10" stroke="#F1A94E" stroke-opacity="0.9" stroke-width="2" stroke-linecap="round"/>
    <path d="M366 206 l8 -10 M378 206 l-8 -10" stroke="#F1A94E" stroke-opacity="0.9" stroke-width="2" stroke-linecap="round"/>
    <text x="360" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#E8F0EB">2 &#183; Spinal cord</text>
    <text x="360" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#A5B8AC">Signal is amplified</text>
  </g>

  <!-- Stage 3: Brain -->
  <g>
    <rect x="498" y="120" width="176" height="180" rx="16" fill="#12231F" stroke="#2C4A44" stroke-width="1.4"/>
    <ellipse cx="586" cy="170" rx="30" ry="34" fill="#2A463F" stroke="#8FBF9B" stroke-opacity="0.55" stroke-width="1.4"/>
    <path d="M566 160 c4 5 3 12 0 18 M586 152 c-4 6 -2 12 4 14 M604 158 c-2 8 2 12 8 10" stroke="#5E9C84" stroke-opacity="0.55" stroke-width="1.2" fill="none"/>
    <text x="586" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#E8F0EB">3 &#183; Brain</text>
    <text x="586" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#A5B8AC">Perceives chronic pain</text>
  </g>

  <!-- Connecting arrows -->
  <g stroke="#8FBF9B" stroke-opacity="0.7" stroke-width="2.4" fill="none">
    <path d="M222 210 l34 0 M262 210 l12 10 M262 210 l12 -10"/>
    <path d="M448 210 l34 0 M488 210 l12 10 M488 210 l12 -10"/>
  </g>

  <!-- Amplification label -->
  <rect x="272" y="330" width="176" height="52" rx="12" fill="#3A3322" stroke="#8A6A3A" stroke-width="1"/>
  <text x="360" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#F1E0A8">Quiet signals, loud pain</text>
  <text x="360" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#C9A54E">The nervous system over-responds</text>

  <!-- Fact panel -->
  <rect x="46" y="330" width="196" height="52" rx="12" fill="#12231F" stroke="#2C4A44" stroke-width="1"/>
  <text x="144" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#CBE3CF">Understand, don&#8217;t ignore</text>
  <text x="144" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#A5B8AC">Knowing the mechanism reduces fear</text>

  <text x="360" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6E8A7C">Pain is real &#8212; and it is amplified, which is why gentle pacing of activity can help retrain it</text>
</svg>
